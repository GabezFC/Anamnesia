# Model Registry: SINGLE source (Connections tab, Config tab, benchmark). Loaded by app/routing/registry.py.
# RULES:
# - price only with source_url + checked_at (official pricing page). Nothing here was verified:
#   every cloud model has price: null => price_status 'unavailable'. Local = 0.0 marginal cost.
# - `verified: false` => the id/model name was NOT confirmed against the provider's model list.
#   Confirm each id before relying on it. context_window null = unknown (never guessed).
# - tier: integer rank (higher = more capable). The number of tiers is whatever this file uses.
# - Cursor is not a model provider (consumer agent profile), so it is not listed.
# - Subset YAML only (maps, lists, [a, b], # comments); no PyYAML dependency.
version: 1
models:
  - id: ollama-qwen-coder
    provider: ollama
    model: qwen2.5-coder
    tier: 1
    context_window: null
    capabilities: [code, cheap_bulk]
    effort_supported: false
    price: null
    local: true
    verified: false
