# Connections catalog (Fase 9). Adding an entry here is enough: no code change needed.
# Fields: id, type (agent|model|mcp), name, command, env_keys, docs_url (only URLs found in this repo,
# else null), status (available|planned), mcp_snippet (hermes_yaml|claude_json|codex_toml|null).
connections:
