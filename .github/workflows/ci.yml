name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    # T0.2: the project declares Python >= 3.14 (requirements.txt); CI used 3.11. "Supported" = green here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Python tests
        # tests/conftest.py: no network, no TypeSafe API, no graphify binary, no real vault —
        # everything is mocked, so this runs unmodified in CI.
        run: pytest tests -q --junitxml=junit.xml
      - name: Annotate failing tests
        if: failure()
        run: python scripts/ci_annotate_failures.py junit.xml

      - name: Publication safety (ANA-048)
        run: python scripts/scan_publication_safety.py --fail-on-findings --no-history --out-dir "$RUNNER_TEMP/pubsafety"

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Frontend import graph check
        run: node scripts/check_frontend_imports.mjs
      # scripts/mcp_smoke.py and any script that needs a live `python -m app.main` server or a
      # headless Chrome/Playwright session are intentionally NOT run here — this job has neither.
      # They stay local/dev-only checks (front-end E2E: ver docs/FRONTEND_WORKSPACE.md).

  # ANA-223: browser E2E in its OWN job (never blocks or slows the unit matrix above). Ubuntu only: the real PTY
  # path there is the POSIX one; Chromium comes from Playwright. Runs on every trigger of this workflow (push, PR, manual dispatch);
  # continue-on-error is intentionally NOT set. NOT verified on a real runner yet (see docs/guides/E2E.md).
  e2e-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser E2E (scripts/e2e_workspace.py)
        env:
          ANAMNESIA_E2E: '1'
          E2E_SERVER_PYTHON: python
          E2E_PORT: '8123'
        run: python -m pytest tests/e2e -q
      - name: Upload E2E evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-evidence
          path: ${{ runner.temp }}/pytest-of-runner
          if-no-files-found: ignore
