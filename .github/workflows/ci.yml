name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    # T0.2: the project declares Python >= 3.14 (requirements.txt); CI used 3.11. "Supported" = green here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Docs/config drift (ANAM-022)
        # Both generated docs must match the code; regenerate locally with the scripts if this fails.
        run: |
          python scripts/gen_config_reference.py --check
          python scripts/gen_interface_docs.py --check
      - name: Python tests
        # tests/conftest.py: no network, no TypeSafe API, no graphify binary, no real vault —
        # everything is mocked, so this runs unmodified in CI.
        # ANAM-022: --block-network fails any real socket; --shuffle-seed=<run_id> shuffles the order with a
        # seed that is registered in the log + job summary (repro: pytest --shuffle-seed=<seed>);
        # --timeout (pytest-timeout) kills a hung test instead of the 6 h job limit.
        # Coverage (fail_under in pyproject.toml, ratchet) is enforced on one leg only: ubuntu + 3.14.
        shell: bash
        run: |
          SEED="${{ github.run_id }}"
          echo "pytest shuffle seed: ${SEED} (os=${{ matrix.os }} py=${{ matrix.python }})" | tee -a "$GITHUB_STEP_SUMMARY"
          COV=""
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python }}" = "3.14" ]; then COV="--cov --cov-report=term"; fi
          pytest tests -q --junitxml=junit.xml --block-network --shuffle-seed="${SEED}" --timeout=300 ${COV}
      - name: Annotate failing tests
        if: failure()
        run: python scripts/ci_annotate_failures.py junit.xml

      - name: Publication safety (ANA-048)
        run: python scripts/scan_publication_safety.py --fail-on-findings --no-history --out-dir "$RUNNER_TEMP/pubsafety"

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Frontend import graph check
        run: node scripts/check_frontend_imports.mjs
      # scripts/mcp_smoke.py and any script that needs a live `python -m app.main` server or a
      # headless Chrome/Playwright session are intentionally NOT run here — this job has neither.
      # They stay local/dev-only checks (front-end E2E: ver docs/FRONTEND_WORKSPACE.md).

  # Clean-container checks: production image builds and answers /health; Dockerfile.test runs the suite per Python.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
      - name: Production image smoke
        run: |
          docker build -t anamnesia:ci .
          docker run -d --name smoke -p 127.0.0.1:8000:8000 anamnesia:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/health
      - name: Test suite in container (Python ${{ matrix.python }})
        run: |
          docker build -f Dockerfile.test --build-arg PYTHON_VERSION=${{ matrix.python }} -t anamnesia-test:${{ matrix.python }} .
          docker run --rm --init anamnesia-test:${{ matrix.python }}

  # ANA-223: browser E2E in its OWN job (never blocks or slows the unit matrix above). Ubuntu only: the real PTY
  # path there is the POSIX one; Chromium comes from Playwright. Runs on every trigger of this workflow (push, PR, manual dispatch);
  # continue-on-error is intentionally NOT set. NOT verified on a real runner yet (see docs/guides/E2E.md).
  e2e-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser E2E (scripts/e2e_workspace.py)
        env:
          ANAMNESIA_E2E: '1'
          E2E_SERVER_PYTHON: python
          E2E_PORT: '8123'
        run: python -m pytest tests/e2e -q
      - name: Upload E2E evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-evidence
          path: ${{ runner.temp }}/pytest-of-runner
          if-no-files-found: ignore
