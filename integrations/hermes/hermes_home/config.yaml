# Isolated Hermes home used ONLY by the Memory Gateway benchmark (HERMES_HOME=<project>/data/hermes_home).
# It never touches the user's real Hermes profile. Consumer model = local Qwen via Ollama (free).
# qwen3 reports 40,960 ctx; Hermes requires >=64K, so context_length is declared here. Our prompts are
# small (< 8k tokens), so the declared value is never approached in practice.
model:
  default: qwen3:14b
  provider: custom
  base_url: http://localhost:11434/v1
  context_length: 65536
  ollama_num_ctx: 65536
memory:
  memory_enabled: false
  user_profile_enabled: false
compression:
  enabled: false
# Hermes defers MCP tools behind tool_search/tool_call by default. Small local models (qwen3:8b) failed to
# drive that bridge (observed 2026-09-24: 23 api calls of malformed tool_call). Expose tools directly.
tools:
  tool_search: false
mcp_servers:
  memory-gateway:
    command: C:\Users\fonse\Projetos_AI\Memory_Gateway\.venv\Scripts\python.exe
    args:
      - -m
      - app.mcp.server
    cwd: C:\Users\fonse\Projetos_AI\Memory_Gateway
    connect_timeout: 60
    timeout: 300
    enabled: true
